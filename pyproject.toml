[tool.ruff]
# Target Python 3.11+
target-version = "py311"

# Set line length
line-length = 100

[tool.ruff.lint]
# Select rulesets: E (pycodestyle), W (whitespace), F (pyflakes), I (isort), UP (pyupgrade)
select = ["E", "W", "F", "I", "UP"]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.format]
# Format configuration
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
